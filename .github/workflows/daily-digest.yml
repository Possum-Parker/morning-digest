name: Daily Digest

on:
  # 22:00 UTC = 08:00 AEST (Brisbane, no DST)
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          PWA_URL: ${{ vars.PWA_URL }}
        run: python scripts/generate_digest.py

      - name: Commit updated digest
        run: |
          git config user.name  "morning-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore: daily digest $(date -u +%Y-%m-%d)"
            git push
          fi
