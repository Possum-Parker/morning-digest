name: Daily Digest

on:
  # Brisbane is UTC+10 year-round. 07:xx UTC = 5:xx PM AEST.
  # We schedule at multiple off-minute times because GitHub Actions notoriously
  # delays or skips scheduled runs at the top of the hour (high contention).
  # The script is idempotent — only the first successful run of the day generates.
  schedule:
    - cron: "30 7 * * *"   # ~5:30 PM AEST primary
    - cron: "50 7 * * *"   # ~5:50 PM AEST fallback 1
    - cron: "15 8 * * *"   # ~6:15 PM AEST fallback 2
    - cron: "45 8 * * *"   # ~6:45 PM AEST fallback 3 (deep fallback)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          PWA_URL: ${{ vars.PWA_URL }}
          # Manual triggers always force regeneration; scheduled fallbacks respect idempotency.
          FORCE_GENERATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/generate_digest.py

      - name: Commit updated digest
        run: |
          git config user.name  "morning-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore: daily digest $(TZ=Australia/Brisbane date +%Y-%m-%d)"
            git push
          fi
